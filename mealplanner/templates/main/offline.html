<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - MealPlanner</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fafafa; color: #333; text-align: center; padding: 20vh 24px 0; }
        h1 { font-size: 1.5rem; }
        p { color: #666; }
        button { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 8px; background: #5f788a; color: #fff; font-size: 1rem; }
    </style>
</head>
<body>
    <h1>You're offline</h1>
    <p>MealPlanner needs a connection to load your plan. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
</body>
</html>
